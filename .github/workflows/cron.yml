# Drains the job queue on the deployed app.
#
# Vercel's Hobby plan only permits daily cron, which is far too slow for order
# processing, so vercel.json keeps a daily safety net and this workflow is the
# real scheduler. Scheduled runs are best-effort: GitHub may delay them under
# load and disables schedules on repos with 60 days of no activity. Move the
# schedule back into vercel.json on Vercel Pro and delete this file.
name: Drain job queue

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: drain-job-queue
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the cron route
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          missing=0
          for name in APP_URL CRON_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing repository secret::${name} is not set (Settings → Secrets and variables → Actions)."
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          code=$(curl -sS -o body.json -w '%{http_code}' --max-time 60 --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer ${CRON_SECRET}" "${APP_URL%/}/api/cron/jobs") || {
            echo "::error title=Cron route unreachable::Could not reach APP_URL (curl exit $?). Check the deployed origin."
            exit 1
          }
          # The route answers 404 to a wrong bearer token, so 404 means misconfiguration.
          if [ "$code" = 404 ]; then
            echo "::error title=Cron route returned 404::CRON_SECRET does not match the Vercel env var, or APP_URL is not the deployed origin."
            exit 1
          fi
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error title=Cron route returned ${code}::$(head -c 300 body.json)"
            exit 1
          fi
          { echo "### Job queue drained"; echo '```json'; cat body.json; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Job queue drained::$(tr -d '\n' < body.json)"
