# Asks the DEPLOYED app to check itself (database, tenant isolation, storage, auth, seed data,
# label renderer, Shopify config, job queue) and reports each check as an annotation.
# Runs after every successful production deployment, daily, and on demand. Authenticates with
# the run's GitHub OIDC token; no repository secrets needed.
name: Preflight (deployed app)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  deployment_status:

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Run the deployed self-check
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          code=$(.github/scripts/call-app.sh /api/cron/preflight body.json 90) || exit 1
          if [ "$code" != 200 ]; then
            echo "::error title=Preflight returned ${code}::$(head -c 300 body.json)"
            exit 1
          fi
          node -e '
            const r = JSON.parse(require("fs").readFileSync("body.json", "utf8"));
            const level = { ok: "notice", warn: "warning", fail: "error" };
            for (const c of r.checks) console.log(`::${level[c.status]} title=${c.status.toUpperCase()} ${c.id}::${c.detail}`);
            const rows = r.checks.map((c) => `| ${c.status} | ${c.id} | ${c.detail} |`).join("\n");
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Preflight: ${r.ok ? "ready" : "NOT ready"}\n\n| | check | detail |\n|---|---|---|\n${rows}\n`);
            process.exit(r.ok ? 0 : 1);
          '
